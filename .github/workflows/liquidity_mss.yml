name: XAUUSD Liquidity Sweep + MSS Alert

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  check-liquidity-mss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run liquidity sweep + MSS check
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python xauusd_liquidity_mss_alert.py

      - name: Commit updated state file
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add mss_state.json
          git diff --staged --quiet || git commit -m "Update MSS state [skip ci]"
          git push
